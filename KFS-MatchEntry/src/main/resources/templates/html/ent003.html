<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>スクール対抗戦申し込み</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>
	<div class="app-container">
		<h1>入力情報確認画面</h1>

		<div class="confirmation-area">
			<p>名前：<span th:text="${entryForm.lastName + ' ' + entryForm.firstName}"></span></p>
			<p>ふりがな：<span th:text="${entryForm.kanaLastName + ' ' + entryForm.kanaFirstName}"></span></p>
			<p>学年：<span th:text="${entryForm.grade}"></span></p>
			<p>会場：<span th:text="${#strings.arrayJoin(entryForm.venue, '・')}"></span></p>
			<p>参加意思：<span th:text="${participateForm.participate}"></span></p>
			<p>参加クラス：<span th:text="${#strings.arrayJoin(participateForm.chooseClass, '・')}"></span></p>
		</div>

		<div class="button-area">
			<form th:action="@{/ent002}" method="post">
				<button type="submit" id="common-button" class="btn btn-info">戻る</button>
			</form>
			<form th:action="@{/end}" method="post">
				<button type="submit" id="common-button" class="btn btn-info">申し込む</button>
			</form>
		</div>
	</div>
</body>

</html>
