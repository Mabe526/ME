<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>スクール対抗戦申し込み</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>
	<div class="app-container">
		<h1>意思情報確認画面</h1>

		<form id="entryform" th:action="@{/ent003}" method="post" th:object="${participateForm}">
			<div class="participate-area">
				<label class="form-label d-block">スクール対抗戦に参加しますか？</label>
				<input type="radio" class="form-check-input" name="participate" value="参加" checked>参加<br>
				<input type="radio" class="form-check-input" name="participate" value="不参加">不参加
			</div>

			<!-- 動的にクラスを出力する部分 -->
			<label class="form-label  d-block">参加するクラス</label>
			<div class="choose-class-area mb-1" th:each="sc : ${selectedClass}">
				<input type="checkbox" class="form-check-input choose-class" th:field="*{chooseClass}" th:value="${sc.className}">
				<span th:text="${sc.className}"></span>
			</div>
			<!-- エラーメッセージ -->
			<div class="text-danger" th:if="${#fields.hasErrors('chooseClass')}" th:errors="*{chooseClass}">
			</div>
		</form>

		<div class="button-area">
			<form th:action="@{/ent001}" method="post">
				<button type="submit" id="common-button" class="btn btn-info">戻る</button>
			</form>
			<button type="submit" form="entryform" id="common-button" class="btn btn-info">次へ</button>
		</div>
	</div>
</body>

<script>
	document.addEventListener('DOMContentLoaded', () => {

		// participate ラジオ
		const participateRadios = document.querySelectorAll('input[name="participate"]');
		// クラスチェックボックス
		const chooseClasses = document.querySelectorAll('.choose-class');
		
		// 不参加の場合のみ、チェックボックスを非活性にする
		function toggleChooseClass() {
			const selected = document.querySelector('input[name="participate"]:checked').value;
			const disabled = (selected === '不参加');

			chooseClasses.forEach(cb => {
				cb.disabled = disabled;
				if (disabled) {
					cb.checked = false; // 不参加ならチェックも外す
				}
			});
		}

		// 初期状態制御（デフォルト「参加」）
		toggleChooseClass();

		// ラジオ変更時
		participateRadios.forEach(radio => {
			radio.addEventListener('change', toggleChooseClass);
		});

	});
</script>


</html>
